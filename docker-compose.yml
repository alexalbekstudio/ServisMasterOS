services:
  db:
    image: postgres:16-alpine
    container_name: servismaster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: servismaster_db
    ports:
      - "5433:5432"
    volumes:
      - servismaster_db_data:/var/lib/postgresql/data
      - ./init_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servismaster_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  servismaster_db_data:
    name: servismaster_db_data