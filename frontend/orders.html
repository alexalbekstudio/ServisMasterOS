<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ServisMasterOS — Radni Nalozi</title>
    <link rel="icon" type="image/png" href="/static/img/logo-a.png">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="/static/img/logo-a.png">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <header>
        <div class="brand-wrapper">
            <img src="/static/img/logo-a.png" alt="Logo" class="brand-logo">
            <div class="brand-text-container">
                <div class="brand-title-row">
                    <h1>Radni Nalozi</h1>
                    <span class="badge">Aktivno</span>
                </div>
                <img src="/static/img/logo-text.png" alt="Studio" class="brand-subtext-img">
            </div>
        </div>
        <button id="btn-ai-assistant" class="btn-secondary header-logout-btn" style="margin-right: 8px;">🤖 Pomoćnik</button>
        <button id="btn-logout" class="btn-secondary header-logout-btn">Odjava</button>
    </header>

    <nav class="nav-links">
        <a href="/" class="nav-link">Prijem Vozila</a>
        <a href="/orders" class="nav-link active">Nalozi u radu</a>
        <a href="/dashboard" class="nav-link">Kontrolna Tabla</a>
        <a href="/inventory" class="nav-link">Magacin</a>
        <a href="/reminders" class="nav-link">SMS Podsetnici</a>
    </nav>

    <main>
        <div id="alert-box" class="status-alert"></div>

        <div class="filters-row">
            <button class="filter-btn active" data-status="ALL">Svi nalozi</button>
            <button class="filter-btn" data-status="RECEIVED">Prijem</button>
            <button class="filter-btn" data-status="IN_PROGRESS">U radu</button>
            <button class="filter-btn" data-status="COMPLETED">Završeno</button>
        </div>

        <div id="orders-list">
            <div class="card empty-state-card">Učitavanje...</div>
        </div>

        <!-- Modal za dodavanje stavke -->
        <div id="item-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Dodaj stavku na nalog</h2>
                    <button type="button" class="btn-secondary modal-close-btn" id="btn-close-modal">&times;</button>
                </div>
                <input type="hidden" id="modal-order-id">
                <div class="form-group">
                    <label for="modal-item-is-part">Tip stavke</label>
                    <select id="modal-item-is-part">
                        <option value="true">⚙️ Rezervni deo</option>
                        <option value="false">🔧 Rad / Usluga</option>
                    </select>
                </div>
                <div id="scanner-controls-wrapper">
                    <button type="button" class="btn-secondary btn-scan-part-trigger" id="btn-scan-part-item">📷 Skeniraj barkod</button>
                    <div id="order-item-scanner-box" class="scanner-box-inline">
                        <div id="order-item-reader"></div>
                    </div>
                </div>
                <div class="form-group item-search-wrapper">
                    <label for="modal-item-title">Naziv dela ili operacije</label>
                    <input type="text" id="modal-item-title" placeholder="Počnite unos..." autocomplete="off">
                    <div id="modal-parts-dropdown" class="item-dropdown-results"></div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label for="modal-item-qty">Količina</label>
                        <input type="number" id="modal-item-qty" value="1.0" step="0.5" min="0.5">
                    </div>
                    <div class="form-group">
                        <label for="modal-item-price">Cena (RSD)</label>
                        <input type="number" id="modal-item-price" placeholder="npr. 1500" min="0">
                    </div>
                </div>
                <div class="form-group approval-checkbox-group">
                    <input type="checkbox" id="modal-item-requires-approval">
                    <label for="modal-item-requires-approval" class="approval-checkbox-label">
                        ⚠️ Dodatni rad — traži odobrenje
                    </label>
                </div>
                <button type="button" class="btn-primary" id="btn-save-item">Upiši stavku</button>
            </div>
        </div>

        <!-- AI Dijagnostika modal -->
        <div id="ai-modal" class="modal-overlay">
            <div class="modal-content" style="max-width: 600px;">
                <div class="modal-header">
                    <h2 class="modal-title">🤖 AI Dijagnostika</h2>
                    <button type="button" class="btn-secondary modal-close-btn" id="btn-close-ai">&times;</button>
                </div>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
                    Unesite simptome. AI će predložiti uzroke.
                </p>
                <div class="form-group">
                    <label for="ai-symptoms">Simptomi</label>
                    <textarea id="ai-symptoms" rows="4" placeholder="npr. Lupa u prednjem trapu..."></textarea>
                </div>
                <button type="button" class="btn-primary" id="btn-run-ai">🤖 Pokreni dijagnostiku</button>
                <div id="ai-result" style="display: none; margin-top: 20px;"></div>
            </div>
        </div>

        <!-- AI Asistent modal -->
        <div id="assistant-modal" class="modal-overlay">
            <div class="modal-content" style="max-width: 600px; max-height: 90vh;">
                <div class="modal-header">
                    <h2 class="modal-title">🤖 AI Pomoćnik</h2>
                    <button type="button" class="btn-secondary modal-close-btn" id="btn-close-assistant">&times;</button>
                </div>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
                    Pitajte bilo šta o popravkama.
                </p>
                <div id="assistant-chat" style="max-height: 400px; overflow-y: auto; margin-bottom: 12px; padding: 8px; background: var(--bg-color); border-radius: var(--radius-md);">
                    <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 20px;">👋 Zdravo!</div>
                </div>
                <div class="form-group">
                    <label for="assistant-question">Vaše pitanje</label>
                    <textarea id="assistant-question" rows="2" placeholder="npr. Kako se menja kaiš na Golfu 7?"></textarea>
                </div>
                <div class="form-group">
                    <label for="assistant-vehicle">Kontekst vozila (opciono)</label>
                    <input type="text" id="assistant-vehicle" placeholder="npr. Golf 7 2.0 TDI 2015">
                </div>
                <button type="button" class="btn-primary" id="btn-ask-assistant">🤖 Pitaj</button>
            </div>
        </div>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/orders.js"></script>
</body>
</html>
